<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeaveSync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #101219;
    --panel: #171B25;
    --panel-2: #1D2230;
    --line: #2A3040;
    --text: #E7E9F0;
    --muted: #868FA6;
    --signal: #F2B33D;
    --ok: #4FD1C5;
    --warn: #F2B33D;
    --bad: #FF6B6B;
    --idle: #5C6480;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ink); color: var(--text); }
  body {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 80px; }

  .masthead { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 28px; }
  .masthead h1 {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .masthead p { margin: 0; color: var(--muted); max-width: 60ch; }
  .pipe { color: var(--signal); }

  .statusbar { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px; font-size: 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--bad); }
  .dot.warn { background: var(--signal); }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 20px; margin-bottom: 20px; }
  .panel h2 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin: 0 0 16px;
    font-weight: 500;
  }

  .drop {
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop:hover, .drop.over { border-color: var(--signal); background: var(--panel-2); }
  .drop strong { font-family: "Space Grotesk", sans-serif; font-size: 15px; }
  .drop span { display: block; color: var(--muted); margin-top: 6px; font-size: 12px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
  button {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button.primary { background: var(--signal); border-color: var(--signal); color: #16181F; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible, .drop:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  label.check { color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; }
  label.check input { accent-color: var(--signal); margin-right: 6px; }

  .tally { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 4px; }
  .tally div { line-height: 1.2; }
  .tally b {
    display: block;
    font-family: "Space Grotesk", sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .tally small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }

  .ledger { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .rowitem { background: var(--panel-2); padding: 12px 14px 12px 16px; border-left: 3px solid var(--idle); }
  .rowitem.create { border-left-color: var(--ok); }
  .rowitem.update { border-left-color: var(--signal); }
  .rowitem.skip, .rowitem.unchanged { border-left-color: var(--idle); }
  .rowitem.failed { border-left-color: var(--bad); }
  .rowhead { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: baseline; }
  .who { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .tag {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .tag.create { color: var(--ok); border-color: var(--ok); }
  .tag.update { color: var(--signal); border-color: var(--signal); }
  .tag.failed { color: var(--bad); border-color: var(--bad); }
  .reason { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .warn { color: var(--warn); font-size: 12px; margin-top: 5px; }
  .fixrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  select {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 7px 9px;
    max-width: 260px;
  }
  .err { color: var(--bad); margin-top: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
